<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrôleur de Lumières Twinkly</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 36px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 660px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 26px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-large {
            width: 100%;
            padding: 16px;
            font-size: 18px;
        }

        .color-picker-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="color"] {
            width: 60px;
            height: 50px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 7px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-tab.active {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 12px;
            max-height: 360px;
            overflow-y: auto;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .movies-grid:empty {
            display: none;
        }

        @keyframes shimmerBar {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .movie-card {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .movie-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(102, 126, 234, 0.2);
        }

        .movie-card.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .movie-preview-bar {
            height: 28px;
            border-radius: 6px;
            background-size: 200% 200%;
            animation: shimmerBar 3.5s ease infinite;
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        .movie-name {
            font-weight: 700;
            font-size: 14px;
            word-break: break-word;
        }

        .movie-desc {
            font-size: 11px;
            color: #64748b;
            line-height: 1.35;
        }

        .movie-card.selected .movie-desc {
            color: rgba(255, 255, 255, 0.88);
        }

        .movie-badge {
            align-self: flex-start;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 999px;
            background: #eef2ff;
            color: #4f46e5;
        }

        .movie-card.selected .movie-badge {
            background: rgba(255, 255, 255, 0.22);
            color: white;
        }

        .queue-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .queue-section h3 {
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .current-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .current-display h4 {
            margin-bottom: 10px;
            font-size: 18px;
        }

        .current-display .time-remaining {
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0;
        }

        .current-display .user-info {
            font-size: 16px;
            opacity: 0.9;
        }

        .queue-list {
            list-style: none;
        }

        .queue-item {
            background: white;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #667eea;
        }

        .queue-item .position {
            background: #667eea;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .queue-item .info {
            flex: 1;
            margin: 0 15px;
        }

        .queue-item .nickname {
            font-weight: 600;
            color: #333;
        }

        .queue-item .choice {
            font-size: 12px;
            color: #666;
            margin-top: 3px;
        }

        .queue-item .color-preview {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #e0e0e0;
        }

        .empty-queue {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }

        .control-type-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .control-type-btn {
            padding: 15px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-weight: 600;
        }

        .control-type-btn:hover {
            border-color: #667eea;
        }

        .control-type-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎄 File d'Attente du Sapin</h1>
        <p class="subtitle">Contrôlez les 600 lumières à tour de rôle!</p>

        <!-- Current Display & Queue Status -->
        <div class="queue-section">
            <h3>⏱️ En Cours</h3>
            <div class="current-display" id="currentDisplay">
                <div class="user-info">En attente du premier utilisateur...</div>
            </div>
            
            <h3>File d'Attente (<span id="queueCount">0</span>)</h3>
            <ul class="queue-list" id="queueList">
                <li class="empty-queue">Personne dans la file</li>
            </ul>
        </div>

        <!-- Join Queue Form -->
        <div class="form-group">
            <label for="nickname">Votre Surnom (Optionnel)</label>
            <input type="text" id="nickname" placeholder="ex: Père Noël, Anonyme, etc." maxlength="20">
        </div>

        <div class="form-group">
            <label>Choisissez le Type de Contrôle</label>
            <div class="control-type-selector">
                <div class="control-type-btn active" onclick="selectControlType('color')" id="colorTypeBtn">
                   🎨 Couleur Unie
                </div>
                <div class="control-type-btn" onclick="selectControlType('effect')" id="effectTypeBtn">
                    ✨ Effets Animés (22)
                </div>
            </div>
        </div>

        <!-- Color Selection -->
        <div class="form-group" id="colorSection">
            <label>Choisissez une Couleur</label>
            <div class="color-picker-group">
                <input type="color" id="colorPicker" value="#ff0000">
                <span id="colorLabel" style="flex: 1; font-weight: 600;">Rouge</span>
            </div>
        </div>

        <!-- Effect Selection -->
        <div class="form-group hidden" id="effectSection">
            <label>Choisissez un Effet</label>
            <div class="filter-tabs">
                <button type="button" class="filter-tab active" id="tab-all" onclick="setEffectFilter('all')">Tous</button>
                <button type="button" class="filter-tab" id="tab-custom" onclick="setEffectFilter('custom')">✨ Effets 3D Exclusifs</button>
                <button type="button" class="filter-tab" id="tab-device" onclick="setEffectFilter('device')">🌲 Classiques du Sapin</button>
            </div>
            <div class="movies-grid" id="moviesGrid"></div>
        </div>

        <button class="btn-primary btn-large" onclick="joinQueue()">
           Rejoindre la File (2 min)
        </button>

        <div id="status" class="status"></div>
    </div>

    <script>
        const API_BASE = '/api';
        let currentMovies = [];
        let selectedMovieId = null;
        let effectFilter = 'all';
        let controlType = 'color'; // 'color' or 'effect'
        let queueUpdateInterval;

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
            setTimeout(() => {
                status.style.display = 'none';
            }, 5000);
        }

        function selectControlType(type) {
            controlType = type;
            document.getElementById('colorTypeBtn').classList.toggle('active', type === 'color');
            document.getElementById('effectTypeBtn').classList.toggle('active', type === 'effect');
            document.getElementById('colorSection').classList.toggle('hidden', type !== 'color');
            document.getElementById('effectSection').classList.toggle('hidden', type !== 'effect');

            if (type === 'effect' && currentMovies.length === 0) {
                loadMovies();
            }
        }

        function setEffectFilter(filter) {
            effectFilter = filter;
            ['all', 'custom', 'device'].forEach(f => {
                document.getElementById(`tab-${f}`).classList.toggle('active', f === filter);
            });
            displayMovies();
        }

        document.getElementById('colorPicker').addEventListener('input', (e) => {
            const color = e.target.value;
            const colorNames = {
                '#ff0000': 'Rouge',
                '#00ff00': 'Vert',
                '#0000ff': 'Bleu',
                '#ffff00': 'Jaune',
                '#ff00ff': 'Magenta',
                '#00ffff': 'Cyan',
                '#ffffff': 'Blanc',
                '#000000': 'Noir',
                '#ffa500': 'Orange',
                '#800080': 'Violet'
            };
            document.getElementById('colorLabel').textContent = colorNames[color.toLowerCase()] || color.toUpperCase();
        });

        async function loadMovies() {
            try {
                const response = await fetch(`${API_BASE}/movies`);
                if (!response.ok) {
                    throw new Error(`Erreur HTTP! statut: ${response.status}`);
                }
                const data = await response.json();
                currentMovies = data.movies || [];
                document.getElementById('effectTypeBtn').textContent = `✨ Effets Animés (${currentMovies.length})`;
                if (selectedMovieId === null && currentMovies.length > 0) {
                    selectedMovieId = currentMovies[0].id;
                }
                displayMovies();
            } catch (error) {
                showStatus('Erreur lors du chargement des effets: ' + error.message, 'error');
            }
        }

        function displayMovies() {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';

            const filtered = currentMovies.filter(m => {
                if (effectFilter === 'custom') return m.source === 'custom';
                if (effectFilter === 'device') return m.source === 'device';
                return true;
            });

            filtered.forEach((movie, index) => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                if (movie.id === selectedMovieId) {
                    card.classList.add('selected');
                }

                const previewEl = document.createElement('div');
                previewEl.className = 'movie-preview-bar';
                previewEl.style.backgroundImage = movie.preview || 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';

                const badgeEl = document.createElement('span');
                badgeEl.className = 'movie-badge';
                badgeEl.textContent = movie.source === 'custom' ? '✨ 3D Temps Réel' : '🌲 Appareil';

                const nameEl = document.createElement('div');
                nameEl.className = 'movie-name';
                nameEl.textContent = movie.name || `Effet ${index + 1}`;

                const descEl = document.createElement('div');
                descEl.className = 'movie-desc';
                descEl.textContent = movie.description || '';

                card.appendChild(previewEl);
                card.appendChild(badgeEl);
                card.appendChild(nameEl);
                if (movie.description) {
                    card.appendChild(descEl);
                }

                card.onclick = () => selectMovie(movie.id);
                grid.appendChild(card);
            });
        }

        function selectMovie(movieId) {
            selectedMovieId = movieId;
            displayMovies();
        }

        async function joinQueue() {
            const nickname = document.getElementById('nickname').value.trim() || 'Anonyme';
            
            if (controlType === 'effect' && selectedMovieId === null) {
                showStatus('Veuillez d\'abord sélectionner un effet!', 'error');
                return;
            }
            
            showStatus('Rejoindre la file...', 'info');
            
            try {
                const payload = {
                    nickname: nickname,
                    type: controlType
                };
                
                if (controlType === 'color') {
                    const color = document.getElementById('colorPicker').value;
                    payload.color = color;
                } else {
                    payload.movieId = selectedMovieId;
                }
                
                const response = await fetch(`${API_BASE}/queue/join`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || `Erreur HTTP! statut: ${response.status}`);
                }
                
                const data = await response.json();
                showStatus(`Vous êtes dans la file! Position: ${data.position}`, 'success');
                updateQueue();
            } catch (error) {
                showStatus('Erreur: ' + error.message, 'error');
            }
        }

        async function updateQueue() {
            try {
                const response = await fetch(`${API_BASE}/queue/status`);
                if (!response.ok) return;
                
                const data = await response.json();
                
                const currentDisplay = document.getElementById('currentDisplay');
                currentDisplay.innerHTML = '';
                if (data.current) {
                    const timeLeft = Math.max(0, Math.ceil(data.current.timeRemaining / 1000));
                    const minutes = Math.floor(timeLeft / 60);
                    const seconds = timeLeft % 60;
                    
                    let choiceText = '';
                    if (data.current.type === 'color') {
                        choiceText = `Couleur: ${data.current.color}`;
                    } else {
                        const movie = currentMovies.find(m => m.id === data.current.movieId);
                        choiceText = `Effet: ${data.current.movieName || (movie ? movie.name : 'Effet ' + data.current.movieId)}`;
                    }
                    
                    const titleEl = document.createElement('h4');
                    titleEl.textContent = data.current.nickname;
                    
                    const timeEl = document.createElement('div');
                    timeEl.className = 'time-remaining';
                    timeEl.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                    
                    const infoEl = document.createElement('div');
                    infoEl.className = 'user-info';
                    infoEl.textContent = choiceText;
                    
                    currentDisplay.appendChild(titleEl);
                    currentDisplay.appendChild(timeEl);
                    currentDisplay.appendChild(infoEl);
                } else {
                    const emptyInfoEl = document.createElement('div');
                    emptyInfoEl.className = 'user-info';
                    emptyInfoEl.textContent = 'En attente du premier utilisateur...';
                    currentDisplay.appendChild(emptyInfoEl);
                }
                
                const queueList = document.getElementById('queueList');
                const queueCount = document.getElementById('queueCount');
                queueCount.textContent = data.queue.length;
                queueList.innerHTML = '';
                
                if (data.queue.length === 0) {
                    const emptyItem = document.createElement('li');
                    emptyItem.className = 'empty-queue';
                    emptyItem.textContent = 'Personne dans la file';
                    queueList.appendChild(emptyItem);
                } else {
                    data.queue.forEach((item, index) => {
                        const li = document.createElement('li');
                        li.className = 'queue-item';
                        
                        const posEl = document.createElement('div');
                        posEl.className = 'position';
                        posEl.textContent = String(index + 1);
                        
                        const infoEl = document.createElement('div');
                        infoEl.className = 'info';
                        
                        const nickEl = document.createElement('div');
                        nickEl.className = 'nickname';
                        nickEl.textContent = item.nickname;
                        
                        const choiceEl = document.createElement('div');
                        choiceEl.className = 'choice';
                        
                        const previewEl = document.createElement('div');
                        previewEl.className = 'color-preview';
                        
                        if (item.type === 'color') {
                            choiceEl.textContent = 'Couleur Unie';
                            if (/^#[0-9a-fA-F]{6}$/.test(item.color)) {
                                previewEl.style.backgroundColor = item.color;
                            }
                        } else {
                            const movie = currentMovies.find(m => m.id === item.movieId);
                            choiceEl.textContent = item.movieName || (movie ? movie.name : `Effet ${item.movieId}`);
                            previewEl.style.backgroundImage = (movie && movie.preview) || 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                        }
                        
                        infoEl.appendChild(nickEl);
                        infoEl.appendChild(choiceEl);
                        li.appendChild(posEl);
                        li.appendChild(infoEl);
                        li.appendChild(previewEl);
                        queueList.appendChild(li);
                    });
                }
            } catch (error) {
                console.error('Erreur lors de la mise à jour de la file:', error);
            }
        }

        queueUpdateInterval = setInterval(updateQueue, 1000);
        loadMovies();
        updateQueue();
    </script>
</body>
</html>
