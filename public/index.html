<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrôleur de Lumières Twinkly — 2400 LED</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 55%, #020617 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
        }

        @media (min-width: 640px) {
            body {
                align-items: center;
                padding: 24px;
            }
        }

        .app-shell {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            max-width: 580px;
            width: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Header & Live Status */
        .top-bar {
            padding: 20px 20px 16px;
            background: rgba(30, 41, 59, 0.85);
            border-bottom: 1px solid #1e293b;
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .title-group h1 {
            font-size: 20px;
            font-weight: 800;
            color: #f8fafc;
            letter-spacing: -0.01em;
        }

        .title-group .subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .queue-toggle-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #a5b4fc;
            padding: 7px 13px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .queue-toggle-btn:hover {
            border-color: #6366f1;
            color: #ffffff;
        }

        .live-banner {
            background: linear-gradient(135deg, rgba(49, 46, 129, 0.75) 0%, rgba(30, 41, 59, 0.9) 55%, rgba(88, 28, 135, 0.7) 100%);
            border: 1px solid rgba(99, 102, 241, 0.35);
            border-radius: 14px;
            padding: 13px 15px;
        }

        .live-row-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 13px;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #e2e8f0;
            min-width: 0;
        }

        .live-indicator strong {
            color: #ffffff;
             truncate: ellipsis;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .pulse-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 8px rgba(52, 211, 153, 0.8);
            animation: pulseDot 1.8s ease-in-out infinite;
            flex-shrink: 0;
        }

        .pulse-dot.idle {
            background: #60a5fa;
            box-shadow: 0 0 8px rgba(96, 165, 250, 0.6);
        }

        .live-timer {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
            font-weight: 700;
            color: #a5b4fc;
            flex-shrink: 0;
        }

        .live-row-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 8px;
            font-size: 12px;
            color: #cbd5e1;
        }

        .progress-track {
            width: 120px;
            height: 6px;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 999px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #34d399, #818cf8);
            border-radius: 999px;
            transition: width 0.5s linear;
        }

        /* Collapsible Queue Drawer */
        .queue-drawer {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #334155;
            display: none;
        }

        .queue-drawer.open {
            display: block;
        }

        .queue-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 160px;
            overflow-y: auto;
        }

        .queue-item {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid #334155;
            padding: 8px 12px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 13px;
        }

        .queue-item-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .queue-pos {
            background: #4f46e5;
            color: #ffffff;
            font-weight: 700;
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 999px;
            flex-shrink: 0;
        }

        .queue-nick {
            font-weight: 600;
            color: #f8fafc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .queue-item-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            font-size: 12px;
            color: #94a3b8;
        }

        .queue-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.25);
            flex-shrink: 0;
        }

        .empty-queue {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            padding: 8px 0;
            font-style: italic;
        }

        /* Main Content Area */
        .content-body {
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Segmented Control */
        .segmented-control {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #1e293b;
            padding: 4px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .seg-btn {
            padding: 10px 12px;
            border-radius: 9px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .seg-btn:hover {
            color: #f8fafc;
        }

        .seg-btn.active {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
        }

        /* Effects Grid */
        @keyframes shimmerBar {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-height: 360px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .movies-grid::-webkit-scrollbar {
            width: 6px;
        }

        .movies-grid::-webkit-scrollbar-track {
            background: #0f172a;
        }

        .movies-grid::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 999px;
        }

        .movie-card {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 11px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .movie-card:hover {
            border-color: #6366f1;
            transform: translateY(-1px);
        }

        .movie-card.selected {
            border-color: #818cf8;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.28) 0%, rgba(139, 92, 246, 0.28) 100%);
            box-shadow: 0 0 0 1px rgba(129, 140, 248, 0.4), 0 6px 16px rgba(99, 102, 241, 0.2);
        }

        .movie-preview-bar {
            height: 26px;
            border-radius: 7px;
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.14);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .movie-preview-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .movie-name {
            font-weight: 700;
            font-size: 13px;
            color: #f8fafc;
            line-height: 1.25;
        }

        .movie-desc {
            font-size: 11px;
            color: #94a3b8;
            line-height: 1.35;
        }

        .movie-card.selected .movie-desc {
            color: #e2e8f0;
        }

        /* 1-Tap Color Swatches */
        .swatches-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        @media (min-width: 480px) {
            .swatches-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .swatch-btn {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 12px 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: #e2e8f0;
        }

        .swatch-btn:hover {
            border-color: #6366f1;
            transform: translateY(-1px);
        }

        .swatch-btn.selected {
            border-color: #818cf8;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.28) 0%, rgba(139, 92, 246, 0.28) 100%);
            box-shadow: 0 0 0 1px rgba(129, 140, 248, 0.4);
        }

        .swatch-circle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
        }

        .swatch-label {
            font-size: 12px;
            font-weight: 600;
            text-align: center;
        }

        .custom-color-row {
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 10px 14px;
        }

        .custom-color-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
        }

        input[type="color"] {
            width: 44px;
            height: 34px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
        }

        /* Sticky Bottom Action Bar */
        .bottom-bar {
            background: rgba(30, 41, 59, 0.95);
            border-top: 1px solid #334155;
            padding: 14px 20px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .action-meta-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nickname-wrap {
            position: relative;
            flex: 1;
            min-width: 0;
        }

        .nickname-input {
            width: 100%;
            padding: 10px 38px 10px 12px;
            background: #0f172a;
            color: #f8fafc;
            border: 1px solid #334155;
            border-radius: 10px;
            font-size: 13px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .nickname-input::placeholder {
            color: #64748b;
        }

        .nickname-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25);
        }

        .dice-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 7px;
            padding: 4px 7px;
            font-size: 13px;
            cursor: pointer;
            line-height: 1;
        }

        .dice-btn:hover {
            background: #334155;
        }

        .selection-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 9px 12px;
            max-width: 195px;
            flex-shrink: 0;
        }

        .selection-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.25);
            flex-shrink: 0;
            background-size: 200% 200%;
            animation: shimmerBar 3.5s ease infinite;
        }

        .selection-name {
            font-size: 12px;
            font-weight: 700;
            color: #e2e8f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-submit {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.5);
        }

        .status {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            display: none;
            text-align: center;
        }

        .status.success {
            background: rgba(16, 185, 129, 0.16);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.35);
        }

        .status.error {
            background: rgba(239, 68, 68, 0.16);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.35);
        }

        .status.info {
            background: rgba(56, 189, 248, 0.16);
            color: #7dd3fc;
            border: 1px solid rgba(56, 189, 248, 0.35);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <!-- Compact Top Header & Live Status -->
        <div class="top-bar">
            <div class="header-row">
                <div class="title-group">
                    <h1>🎄 Sapin du Quartier</h1>
                    <p class="subtitle">Contrôlez les 2400 lumières à tour de rôle!</p>
                </div>
                <button type="button" class="queue-toggle-btn" id="queueToggleBtn" onclick="toggleQueueDrawer()">
                    👥 File (<span id="queueCount">0</span>) <span id="queueChevron">▼</span>
                </button>
            </div>

            <div class="live-banner" id="currentDisplay">
                <div class="live-row-top">
                    <div class="live-indicator">
                        <span class="pulse-dot idle" id="liveDot"></span>
                        <span id="liveUserText">Sapin prêt — Choisissez un effet pour démarrer!</span>
                    </div>
                    <span class="live-timer" id="liveTimerText"></span>
                </div>
                <div class="live-row-bottom hidden" id="liveBottomRow">
                    <span id="liveChoiceText"></span>
                    <div class="progress-track">
                        <div class="progress-fill" id="liveProgressFill" style="width: 100%;"></div>
                    </div>
                </div>
            </div>

            <div class="queue-drawer" id="queueDrawer">
                <ul class="queue-list" id="queueList">
                    <li class="empty-queue">Personne dans la file d'attente</li>
                </ul>
            </div>
        </div>

        <!-- Main Body -->
        <div class="content-body">
            <!-- Mode Segmented Switcher -->
            <div class="segmented-control">
                <button type="button" class="seg-btn active" id="effectTypeBtn" onclick="selectControlType('effect')">
                    ✨ Effets Animés
                </button>
                <button type="button" class="seg-btn" id="colorTypeBtn" onclick="selectControlType('color')">
                    🎨 Couleur Unie
                </button>
            </div>

            <!-- Effects Grid -->
            <div id="effectSection">
                <div class="movies-grid" id="moviesGrid"></div>
            </div>

            <!-- 1-Tap Color Swatches -->
            <div id="colorSection" class="hidden">
                <div class="swatches-grid" id="swatchesGrid"></div>
                <div class="custom-color-row">
                    <div class="custom-color-left">
                        <span>🎨 Autre couleur personnalisée</span>
                        <span id="customHexLabel" style="color: #94a3b8; font-size: 12px;">#EF4444</span>
                    </div>
                    <input type="color" id="colorPicker" value="#ef4444">
                </div>
            </div>
        </div>

        <!-- Sticky Bottom Action Bar -->
        <div class="bottom-bar">
            <div id="status" class="status"></div>

            <div class="action-meta-row">
                <div class="nickname-wrap">
                    <input type="text" id="nickname" class="nickname-input" placeholder="Votre surnom (ex: Père Noël)" maxlength="20">
                    <button type="button" class="dice-btn" onclick="pickRandomNickname()" title="Générer un surnom festif">🎲</button>
                </div>
                <div class="selection-pill" title="Votre sélection actuelle">
                    <span class="selection-dot" id="selectionDot"></span>
                    <span class="selection-name" id="selectionName">Chargement...</span>
                </div>
            </div>

            <button type="button" class="btn-submit" id="submitQueueBtn" onclick="joinQueue()">
                🚀 Illuminer le Sapin (2 min)
            </button>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        const PRESET_COLORS = [
            { hex: '#ef4444', name: 'Rouge Noël' },
            { hex: '#22c55e', name: 'Vert Sapin' },
            { hex: '#f59e0b', name: 'Or Chaud' },
            { hex: '#38bdf8', name: 'Bleu Glace' },
            { hex: '#a855f7', name: 'Violet Royal' },
            { hex: '#ec4899', name: 'Rose Festif' },
            { hex: '#06b6d4', name: 'Turquoise' },
            { hex: '#fffbeb', name: 'Blanc Chaud' }
        ];

        const FESTIVE_NICKNAMES = [
            'Lutin Givré',
            'Renne Étoilé',
            'Père Noël',
            'Flocon Magique',
            'Bonhomme de Neige',
            'Étoile du Nord',
            'Sapin Enchanté',
            'Ours Polaire',
            'Clochette Dorée',
            'Sucre d\'Orge'
        ];

        let currentMovies = [];
        let selectedMovieId = null;
        let selectedColor = PRESET_COLORS[0].hex;
        let selectedColorName = PRESET_COLORS[0].name;
        let controlType = 'effect'; // Default to effects
        let queueDrawerOpen = false;
        let statusTimeout = null;

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
            if (statusTimeout) clearTimeout(statusTimeout);
            statusTimeout = setTimeout(() => {
                status.style.display = 'none';
            }, 5000);
        }

        function toggleQueueDrawer() {
            queueDrawerOpen = !queueDrawerOpen;
            document.getElementById('queueDrawer').classList.toggle('open', queueDrawerOpen);
            document.getElementById('queueChevron').textContent = queueDrawerOpen ? '▲' : '▼';
        }

        function pickRandomNickname() {
            const input = document.getElementById('nickname');
            const current = input.value;
            const choices = FESTIVE_NICKNAMES.filter(n => n !== current);
            input.value = choices[Math.floor(Math.random() * choices.length)];
        }

        function selectControlType(type) {
            controlType = type;
            document.getElementById('effectTypeBtn').classList.toggle('active', type === 'effect');
            document.getElementById('colorTypeBtn').classList.toggle('active', type === 'color');
            document.getElementById('effectSection').classList.toggle('hidden', type !== 'effect');
            document.getElementById('colorSection').classList.toggle('hidden', type !== 'color');
            updateSelectionSummary();
        }

        function renderColorSwatches() {
            const grid = document.getElementById('swatchesGrid');
            grid.innerHTML = '';

            PRESET_COLORS.forEach(item => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'swatch-btn' + (selectedColor.toLowerCase() === item.hex.toLowerCase() ? ' selected' : '');

                const circle = document.createElement('span');
                circle.className = 'swatch-circle';
                circle.style.backgroundColor = item.hex;

                const label = document.createElement('span');
                label.className = 'swatch-label';
                label.textContent = item.name;

                btn.appendChild(circle);
                btn.appendChild(label);
                btn.onclick = () => {
                    selectedColor = item.hex;
                    selectedColorName = item.name;
                    document.getElementById('colorPicker').value = item.hex;
                    document.getElementById('customHexLabel').textContent = item.hex.toUpperCase();
                    renderColorSwatches();
                    updateSelectionSummary();
                };
                grid.appendChild(btn);
            });
        }

        document.getElementById('colorPicker').addEventListener('input', (e) => {
            selectedColor = e.target.value;
            const match = PRESET_COLORS.find(c => c.hex.toLowerCase() === selectedColor.toLowerCase());
            selectedColorName = match ? match.name : selectedColor.toUpperCase();
            document.getElementById('customHexLabel').textContent = selectedColor.toUpperCase();
            renderColorSwatches();
            updateSelectionSummary();
        });

        function updateSelectionSummary() {
            const dot = document.getElementById('selectionDot');
            const nameEl = document.getElementById('selectionName');

            if (controlType === 'color') {
                dot.style.backgroundImage = 'none';
                dot.style.backgroundColor = selectedColor;
                nameEl.textContent = selectedColorName;
            } else {
                const movie = currentMovies.find(m => m.id === selectedMovieId);
                dot.style.backgroundColor = 'transparent';
                dot.style.backgroundImage = (movie && movie.preview) || 'linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%)';
                nameEl.textContent = movie ? movie.name : 'Choisir un effet';
            }
        }

        async function loadMovies() {
            try {
                const response = await fetch(`${API_BASE}/movies`);
                if (!response.ok) {
                    throw new Error(`Erreur HTTP! statut: ${response.status}`);
                }
                const data = await response.json();
                currentMovies = data.movies || [];
                document.getElementById('effectTypeBtn').textContent = `✨ Effets Animés (${currentMovies.length})`;
                if (selectedMovieId === null && currentMovies.length > 0) {
                    selectedMovieId = currentMovies[0].id;
                }
                displayMovies();
                updateSelectionSummary();
            } catch (error) {
                showStatus('Erreur lors du chargement des effets: ' + error.message, 'error');
            }
        }

        let activePreviewCanvases = [];

        function hsvToRgbPreview(h, s, v) {
            h = ((h % 1) + 1) % 1;
            const i = Math.floor(h * 6);
            const f = h * 6 - i;
            const p = v * (1 - s);
            const q = v * (1 - f * s);
            const t = v * (1 - (1 - f) * s);
            let r = 0, g = 0, b = 0;
            switch (i % 6) {
                case 0: r = v; g = t; b = p; break;
                case 1: r = q; g = v; b = p; break;
                case 2: r = p; g = v; b = t; break;
                case 3: r = p; g = q; b = v; break;
                case 4: r = t; g = p; b = v; break;
                case 5: r = v; g = p; b = q; break;
            }
            return [Math.round(r * 255), Math.round(g * 255), Math.round(b * 255)];
        }

        function hash01Preview(n) {
            const x = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
            return x - Math.floor(x);
        }

        // Compute realistic [r, g, b] for LED index i (0..N-1) at time t (seconds) for each effect
        function evalPreviewLed(movie, i, total, t) {
            const u = i / Math.max(1, total - 1); // 0..1 position along bar
            const id = String(movie.id);
            const name = (movie.name || '').toLowerCase();

            switch (id) {
                case 'custom:aurora': {
                    const wave = Math.sin(u * 4.5 - t * 2.2) * 0.5 + 0.5;
                    return hsvToRgbPreview(0.36 + wave * 0.42, 0.9, 0.95);
                }
                case 'custom:fireplace': {
                    const flick = Math.sin(t * 8.0 + i * 1.3) * 0.5 + Math.cos(t * 13.0 - i * 0.7) * 0.5;
                    const heat = Math.max(0.25, Math.min(1, 0.72 + flick * 0.32));
                    return [255, Math.round(Math.max(20, Math.min(215, (heat - 0.15) * 240))), Math.round(Math.max(0, (heat - 0.75) * 260))];
                }
                case 'custom:candycane_spiral':
                case '5': {
                    const stripe = Math.sin((u * 3.0 - t * 1.1) * Math.PI * 2);
                    return stripe > 0 ? [239, 35, 60] : [255, 245, 230];
                }
                case 'custom:starlight_gold': {
                    const seed = hash01Preview(i + 11);
                    const sp = Math.pow(Math.max(0, Math.sin(t * (2.5 + seed * 3) + seed * 40)), 8);
                    return [Math.round(215 + sp * 40), Math.round(140 + sp * 115), Math.round(25 + sp * 210)];
                }
                case 'custom:meteor_shower': {
                    const head = (t * 0.85) % 1.35 - 0.15;
                    const dist = head - u;
                    if (dist >= -0.05 && dist < 0.35) {
                        const k = dist < 0 ? 1 : Math.pow(1 - dist / 0.35, 1.8);
                        return [Math.round(60 + k * 195), Math.round(170 + k * 85), 255];
                    }
                    return [15, 75, 210];
                }
                case 'custom:rainbow_vortex':
                case '3': {
                    return hsvToRgbPreview(u - t * 0.45, 0.95, 1.0);
                }
                case 'custom:christmas_classic': {
                    const sp = Math.pow(Math.max(0, Math.sin(t * 3.0 + i * 1.7)), 6);
                    const boost = Math.round(sp * 160);
                    if (i % 3 === 0) return [255, Math.min(255, 25 + boost), Math.min(255, 25 + boost)];
                    if (i % 3 === 1) return [Math.min(255, 20 + boost), 235, Math.min(255, 45 + boost)];
                    return [255, Math.min(255, 185 + boost), Math.min(255, 40 + boost)];
                }
                case 'custom:icy_blizzard':
                case '0': {
                    const swirl = Math.sin(u * 5.0 - t * 2.8) * 0.5 + 0.5;
                    const snow = Math.pow(Math.max(0, Math.sin(t * 4.5 + i * 2.1)), 7);
                    return [
                        Math.min(255, Math.round(30 + swirl * 90 + snow * 180)),
                        Math.min(255, Math.round(150 + swirl * 80 + snow * 90)),
                        255
                    ];
                }
                case 'custom:cyberpunk': {
                    const blend = Math.sin(u * 4.5 - t * 2.6) * 0.5 + 0.5;
                    return [
                        Math.round(247 * blend + 20 * (1 - blend)),
                        Math.round(37 * blend + 225 * (1 - blend)),
                        Math.round(133 * blend + 255 * (1 - blend))
                    ];
                }
                case 'custom:heartbeat': {
                    const cycle = (t % 1.2) / 1.2;
                    const b1 = Math.exp(-Math.pow((cycle - 0.18) / 0.07, 2));
                    const b2 = 0.8 * Math.exp(-Math.pow((cycle - 0.38) / 0.09, 2));
                    const p = Math.min(1, b1 + b2);
                    return [Math.round(135 + p * 120), Math.round(15 + p * 75), Math.round(40 + p * 95)];
                }
                case 'custom:matrix': {
                    const w = Math.sin(u * 6.0 - t * 3.2) * 0.5 + 0.5;
                    return [Math.round(w * 55), Math.round(90 + w * 165), Math.round(40 + w * 110)];
                }
                case 'custom:confetti': {
                    const bucket = Math.floor(t * 4 + hash01Preview(i) * 10);
                    const hue = hash01Preview(i * 3.7 + bucket * 11.3);
                    const v = 0.65 + 0.35 * Math.sin(t * 6 + i * 2.1);
                    return hsvToRgbPreview(hue, 0.88, v);
                }
                case '1': {
                    // Rotor / Hélice Lumineuse: 4 rotating vertical color blades (Red, Green, Blue, Gold)
                    const palette = [
                        [239, 68, 68],   // Red
                        [34, 197, 94],   // Green
                        [59, 130, 246],  // Blue
                        [250, 204, 21]   // Gold/Yellow
                    ];
                    const pos = ((u * 2.0 - t * 0.9) % 1 + 1) % 1 * palette.length;
                    const idxA = Math.floor(pos) % palette.length;
                    const idxB = (idxA + 1) % palette.length;
                    const frac = pos - Math.floor(pos);
                    const smooth = frac > 0.75 ? (frac - 0.75) * 4 : 0;
                    return [
                        Math.round(palette[idxA][0] * (1 - smooth) + palette[idxB][0] * smooth),
                        Math.round(palette[idxA][1] * (1 - smooth) + palette[idxB][1] * smooth),
                        Math.round(palette[idxA][2] * (1 - smooth) + palette[idxB][2] * smooth)
                    ];
                }
                case '2': {
                    // Snow / Neige d'Hiver: calm winter sky with soft white drifting snow
                    const drift = Math.sin(u * 4.0 - t * 1.8 + i * 0.5) * 0.5 + 0.5;
                    const flake = Math.pow(drift, 3);
                    return [
                        Math.round(20 + flake * 235),
                        Math.round(130 + flake * 125),
                        Math.round(220 + flake * 35)
                    ];
                }
                case '4': {
                    // Bright Twinkle / Scintillement Vif: deep blue & gold with bright white flash
                    const seed = hash01Preview(i * 7 + 3);
                    const flash = Math.pow(Math.max(0, Math.sin(t * (3.5 + seed * 4) + seed * 30)), 10);
                    return [
                        Math.round(45 + flash * 210),
                        Math.round(95 + flash * 160),
                        Math.round(190 + flash * 65)
                    ];
                }
                case '6': {
                    // Sunset / Coucher de Soleil: warm purple -> crimson -> orange -> gold
                    const w = Math.sin(u * 3.2 - t * 1.2) * 0.5 + 0.5;
                    return [
                        Math.round(160 + w * 95),
                        Math.round(35 + Math.pow(w, 1.5) * 175),
                        Math.round(120 * (1 - w) + 20 * w)
                    ];
                }
                case '7': {
                    // Diagonal / Vagues Diagonales: crisp moving color bands
                    const bands = [
                        [239, 68, 68],
                        [245, 158, 11],
                        [16, 185, 129],
                        [59, 130, 246],
                        [168, 85, 247]
                    ];
                    const idx = Math.floor(((u * 3.5 - t * 1.3) % 1 + 1) % 1 * bands.length) % bands.length;
                    return bands[idx];
                }
                case '8': {
                    // Vintage / Noël Vintage: warm amber & soft gold filament glow
                    const glow = 0.7 + 0.3 * Math.sin(t * 3.2 + i * 1.9);
                    return [
                        Math.round(220 * glow + 35),
                        Math.round(135 * glow + 15),
                        Math.round(30 * glow)
                    ];
                }
                case '9':
                default: {
                    // Slow wave / Vague Douce: gentle oceanic & violet wave
                    const w = Math.sin(u * 3.0 - t * 0.85) * 0.5 + 0.5;
                    return hsvToRgbPreview(0.52 + w * 0.22, 0.85, 0.95);
                }
            }
        }

        function animatePreviewCanvases() {
            const t = performance.now() / 1000;
            const numDots = 12;

            for (let c = 0; c < activePreviewCanvases.length; c++) {
                const { canvas, ctx, movie } = activePreviewCanvases[c];
                const w = canvas.width;
                const h = canvas.height;
                ctx.clearRect(0, 0, w, h);

                const spacing = w / numDots;
                const radius = Math.min(spacing * 0.36, h * 0.34);

                for (let i = 0; i < numDots; i++) {
                    const [r, g, b] = evalPreviewLed(movie, i, numDots, t);
                    const cx = spacing * (i + 0.5);
                    const cy = h * 0.5;

                    // Outer soft LED glow
                    const grad = ctx.createRadialGradient(cx, cy, radius * 0.2, cx, cy, radius * 1.85);
                    grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, 1)`);
                    grad.addColorStop(0.55, `rgba(${r}, ${g}, ${b}, 0.45)`);
                    grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(cx, cy, radius * 1.85, 0, Math.PI * 2);
                    ctx.fill();

                    // Bright LED core
                    ctx.fillStyle = `rgb(${Math.min(255, r + 35)}, ${Math.min(255, g + 35)}, ${Math.min(255, b + 35)})`;
                    ctx.beginPath();
                    ctx.arc(cx, cy, radius * 0.72, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            requestAnimationFrame(animatePreviewCanvases);
        }

        function displayMovies() {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';
            activePreviewCanvases = [];

            currentMovies.forEach((movie, index) => {
                const card = document.createElement('div');
                card.className = 'movie-card' + (movie.id === selectedMovieId ? ' selected' : '');

                const previewEl = document.createElement('div');
                previewEl.className = 'movie-preview-bar';

                const canvas = document.createElement('canvas');
                canvas.className = 'movie-preview-canvas';
                canvas.width = 200;
                canvas.height = 26;
                previewEl.appendChild(canvas);
                const ctx = canvas.getContext('2d');
                activePreviewCanvases.push({ canvas, ctx, movie });

                const nameEl = document.createElement('div');
                nameEl.className = 'movie-name';
                nameEl.textContent = movie.name || `Effet ${index + 1}`;

                const descEl = document.createElement('div');
                descEl.className = 'movie-desc';
                descEl.textContent = movie.description || '';

                card.appendChild(previewEl);
                card.appendChild(nameEl);
                if (movie.description) {
                    card.appendChild(descEl);
                }

                card.onclick = () => selectMovie(movie.id);
                grid.appendChild(card);
            });
        }

        requestAnimationFrame(animatePreviewCanvases);

        function selectMovie(movieId) {
            selectedMovieId = movieId;
            displayMovies();
            updateSelectionSummary();
        }

        async function joinQueue() {
            const nickname = document.getElementById('nickname').value.trim() || 'Anonyme';

            if (controlType === 'effect' && selectedMovieId === null) {
                showStatus('Veuillez d\'abord sélectionner un effet!', 'error');
                return;
            }

            showStatus('Ajout à la file en cours...', 'info');

            try {
                const payload = {
                    nickname,
                    type: controlType
                };

                if (controlType === 'color') {
                    payload.color = selectedColor;
                } else {
                    payload.movieId = selectedMovieId;
                }

                const response = await fetch(`${API_BASE}/queue/join`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || `Erreur HTTP! statut: ${response.status}`);
                }

                const data = await response.json();
                showStatus(`✅ C'est parti ! Vous êtes en position #${data.position}`, 'success');
                updateQueue();
            } catch (error) {
                showStatus(error.message, 'error');
            }
        }

        async function updateQueue() {
            try {
                const response = await fetch(`${API_BASE}/queue/status`);
                if (!response.ok) return;

                const data = await response.json();

                const liveDot = document.getElementById('liveDot');
                const liveUserText = document.getElementById('liveUserText');
                const liveTimerText = document.getElementById('liveTimerText');
                const liveBottomRow = document.getElementById('liveBottomRow');
                const liveChoiceText = document.getElementById('liveChoiceText');
                const liveProgressFill = document.getElementById('liveProgressFill');

                const submitBtn = document.getElementById('submitQueueBtn');

                if (data.sleeping) {
                    const wakeTime = (data.schedule && data.schedule.onTime) || '16:30';
                    liveDot.className = 'pulse-dot idle';
                    liveUserText.textContent = `🌙 Le sapin se repose pour la nuit — Réouverture à ${wakeTime} !`;
                    liveTimerText.textContent = '';
                    liveBottomRow.classList.add('hidden');
                    if (submitBtn) {
                        submitBtn.disabled = true;
                        submitBtn.style.opacity = '0.55';
                        submitBtn.textContent = `🌙 Sapin en veille jusqu'à ${wakeTime}`;
                    }
                } else if (data.current) {
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.style.opacity = '1';
                        submitBtn.textContent = '🚀 Illuminer le Sapin (2 min)';
                    }
                    const timeLeft = Math.max(0, Math.ceil(data.current.timeRemaining / 1000));
                    const minutes = Math.floor(timeLeft / 60);
                    const seconds = timeLeft % 60;
                    const pct = Math.max(0, Math.min(100, (data.current.timeRemaining / 120000) * 100));

                    liveDot.className = 'pulse-dot';
                    liveUserText.textContent = '';
                    const prefix = document.createTextNode('En cours : ');
                    const strong = document.createElement('strong');
                    strong.textContent = data.current.nickname;
                    liveUserText.appendChild(prefix);
                    liveUserText.appendChild(strong);

                    liveTimerText.textContent = `${minutes}:${seconds.toString().padStart(2, '0')} restant`;

                    let choiceText = '';
                    if (data.current.type === 'color') {
                        const match = PRESET_COLORS.find(c => c.hex.toLowerCase() === String(data.current.color).toLowerCase());
                        choiceText = `🎨 Couleur : ${match ? match.name : data.current.color}`;
                    } else {
                        const movie = currentMovies.find(m => m.id === data.current.movieId);
                        choiceText = `✨ ${data.current.movieName || (movie ? movie.name : 'Effet ' + data.current.movieId)}`;
                    }
                    liveChoiceText.textContent = choiceText;
                    liveProgressFill.style.width = `${pct}%`;
                    liveBottomRow.classList.remove('hidden');
                } else {
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.style.opacity = '1';
                        submitBtn.textContent = '🚀 Illuminer le Sapin (2 min)';
                    }
                    liveDot.className = 'pulse-dot idle';
                    liveUserText.textContent = data.idleEffect && data.idleEffect.movieName
                        ? `Sapin libre (En boucle : ${data.idleEffect.movieName}) — Votre tour démarre immédiatement !`
                        : 'Sapin libre — Votre tour démarre immédiatement !';
                    liveTimerText.textContent = '';
                    liveBottomRow.classList.add('hidden');
                }

                const queueList = document.getElementById('queueList');
                const queueCount = document.getElementById('queueCount');
                queueCount.textContent = data.queue.length;
                queueList.innerHTML = '';

                if (data.queue.length === 0) {
                    const emptyItem = document.createElement('li');
                    emptyItem.className = 'empty-queue';
                    emptyItem.textContent = 'Personne dans la file d\'attente';
                    queueList.appendChild(emptyItem);
                } else {
                    data.queue.forEach((item, index) => {
                        const li = document.createElement('li');
                        li.className = 'queue-item';

                        const leftEl = document.createElement('div');
                        leftEl.className = 'queue-item-left';

                        const posEl = document.createElement('span');
                        posEl.className = 'queue-pos';
                        posEl.textContent = `#${index + 1}`;

                        const nickEl = document.createElement('span');
                        nickEl.className = 'queue-nick';
                        nickEl.textContent = item.nickname;

                        leftEl.appendChild(posEl);
                        leftEl.appendChild(nickEl);

                        const rightEl = document.createElement('div');
                        rightEl.className = 'queue-item-right';

                        const choiceEl = document.createElement('span');
                        const dotEl = document.createElement('span');
                        dotEl.className = 'queue-dot';

                        if (item.type === 'color') {
                            const match = PRESET_COLORS.find(c => c.hex.toLowerCase() === String(item.color).toLowerCase());
                            choiceEl.textContent = match ? match.name : 'Couleur Unie';
                            if (/^#[0-9a-fA-F]{6}$/.test(item.color)) {
                                dotEl.style.backgroundColor = item.color;
                            }
                        } else {
                            const movie = currentMovies.find(m => m.id === item.movieId);
                            choiceEl.textContent = item.movieName || (movie ? movie.name : `Effet ${item.movieId}`);
                            dotEl.style.backgroundImage = (movie && movie.preview) || 'linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%)';
                        }

                        rightEl.appendChild(choiceEl);
                        rightEl.appendChild(dotEl);

                        li.appendChild(leftEl);
                        li.appendChild(rightEl);
                        queueList.appendChild(li);
                    });
                }
            } catch (error) {
                console.error('Erreur lors de la mise à jour de la file:', error);
            }
        }

        renderColorSwatches();
        loadMovies();
        updateQueue();
        setInterval(updateQueue, 1000);
    </script>
