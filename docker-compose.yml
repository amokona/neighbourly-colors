services:
  twinkly-web-controller:
    build: https://github.com/amokona/neighbourly-colors.git#main
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - TWINKLY_IP=${TWINKLY_IP:-fallback}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - DEFAULT_MOVIE_ID=${DEFAULT_MOVIE_ID:-}
    volumes:
      - ./data:/app/data
